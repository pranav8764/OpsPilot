syntax = "proto3";

package opspilot.integration.v1;

option go_package = "github.com/opspilot/opspilot/gen/go/integration/v1;integrationv1";

// ── GitHub App config ─────────────────────────────────────────

message GetGitHubConfigRequest {
    string user_id = 1;
}

message GetGitHubConfigResponse {
    string install_url  = 1;
    string callback_url = 2;
    string webhook_url  = 3;
    bool configured     = 4;
}

// ── GitHub installation/repository shapes ─────────────────────

message GitHubInstallation {
    string id                    = 1;
    int64 installation_id        = 2;
    string account_login         = 3;
    string account_type          = 4;
    string repository_selection  = 5;
    string status                = 6;
    string installed_at          = 7;
}

message GitHubRepository {
    int64 repository_id    = 1;
    string owner           = 2;
    string name            = 3;
    string full_name       = 4;
    string html_url        = 5;
    string clone_url       = 6;
    string default_branch  = 7;
    bool private           = 8;
}

message RepositoryConnection {
    string id                      = 1;
    string workspace_id            = 2;
    string project_id              = 3;
    string full_name               = 4;
    string html_url                = 5;
    string selected_branch         = 6;
    string status                  = 7;
    string last_indexed_commit_sha = 8;
    string last_indexed_at         = 9;
}

message IngestionJob {
    string id                = 1;
    string workspace_id      = 2;
    string project_id        = 3;
    string status            = 4;
    string source_branch     = 5;
    string source_commit_sha = 6;
    string started_at        = 7;
    string finished_at       = 8;
}

// ── Service ───────────────────────────────────────────────────

service IntegrationService {
    rpc GetGitHubConfig(GetGitHubConfigRequest) returns (GetGitHubConfigResponse);
    rpc CreateGitHubInstallSession(CreateGitHubInstallSessionRequest) returns (CreateGitHubInstallSessionResponse);
    rpc CompleteGitHubInstallSession(CompleteGitHubInstallSessionRequest) returns (CompleteGitHubInstallSessionResponse);
    rpc HandleGitHubCallback(HandleGitHubCallbackRequest) returns (HandleGitHubCallbackResponse);
    rpc ListInstallations(ListInstallationsRequest) returns (ListInstallationsResponse);
    rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);
    rpc AttachRepository(AttachRepositoryRequest) returns (AttachRepositoryResponse);
    rpc GetRepositoryConnection(GetRepositoryConnectionRequest) returns (GetRepositoryConnectionResponse);
    rpc HandleGitHubWebhook(HandleGitHubWebhookRequest) returns (HandleGitHubWebhookResponse);
    rpc DecideFixApproval(DecideFixApprovalRequest) returns (DecideFixApprovalResponse);
    rpc UpsertLogProviderConnection(UpsertLogProviderConnectionRequest) returns (UpsertLogProviderConnectionResponse);
    rpc ListLogProviderConnections(ListLogProviderConnectionsRequest) returns (ListLogProviderConnectionsResponse);
    rpc CollectProviderLogs(CollectProviderLogsRequest) returns (CollectProviderLogsResponse);
}

message CreateGitHubInstallSessionRequest {
    string user_id = 1;
    string workspace_id = 2;
}

message CreateGitHubInstallSessionResponse {
    string install_url = 1;
    string expires_at = 2;
}

message CompleteGitHubInstallSessionRequest {
    string state = 1;
    int64 installation_id = 2;
}

message CompleteGitHubInstallSessionResponse {
    GitHubInstallation installation = 1;
    string workspace_id = 2;
}

message HandleGitHubCallbackRequest {
    string user_id = 1;
    string workspace_id = 2;
    int64 installation_id = 3;
}

message HandleGitHubCallbackResponse {
    GitHubInstallation installation = 1;
}

message ListInstallationsRequest {
    string user_id = 1;
    string workspace_id = 2;
}

message ListInstallationsResponse {
    repeated GitHubInstallation installations = 1;
}

message ListRepositoriesRequest {
    string user_id = 1;
    string workspace_id = 2;
    string github_installation_id = 3;
}

message ListRepositoriesResponse {
    repeated GitHubRepository repositories = 1;
}

message AttachRepositoryRequest {
    string user_id = 1;
    string workspace_id = 2;
    string project_id = 3;
    string github_installation_id = 4;
    int64 repository_id = 5;
    string owner = 6;
    string name = 7;
    string full_name = 8;
    string html_url = 9;
    string clone_url = 10;
    string default_branch = 11;
    string selected_branch = 12;
    bool private = 13;
}

message AttachRepositoryResponse {
    RepositoryConnection repository_connection = 1;
    IngestionJob ingestion_job = 2;
}

message GetRepositoryConnectionRequest {
    string user_id = 1;
    string workspace_id = 2;
    string project_id = 3;
}

message GetRepositoryConnectionResponse {
    RepositoryConnection repository_connection = 1;
    IngestionJob latest_ingestion_job = 2;
}

message HandleGitHubWebhookRequest {
    string event_type = 1;
    string signature = 2;
    bytes payload = 3;
}

message HandleGitHubWebhookResponse {
    bool success = 1;
}

message DecideFixApprovalRequest {
    string user_id = 1;
    string workspace_id = 2;
    string project_id = 3;
    string approval_id = 4;
    string decision = 5; // approve | reject
    string reason = 6;
}

message DecideFixApprovalResponse {
    string approval_id = 1;
    string approval_status = 2;
    string pull_request_url = 3;
    int64 pull_request_number = 4;
    string branch = 5;
}

message LogProviderConnection {
    string id = 1;
    string provider = 2;
    string display_name = 3;
    string project_id = 4;
    string deployment_id = 5;
    string scope_id = 6;
    string token_kind = 7;
    string status = 8;
    string created_at = 9;
    string updated_at = 10;
}

message UpsertLogProviderConnectionRequest {
    string user_id = 1;
    string workspace_id = 2;
    string provider = 3;       // vercel | railway
    string display_name = 4;
    string token = 5;
    string project_id = 6;     // required for Vercel; informational for Railway
    string deployment_id = 7;  // required for Railway; optional for Vercel
    string scope_id = 8;       // Vercel teamId/slug; optional
    string token_kind = 9;     // bearer | project_token
}

message UpsertLogProviderConnectionResponse {
    LogProviderConnection connection = 1;
}

message ListLogProviderConnectionsRequest {
    string user_id = 1;
    string workspace_id = 2;
}

message ListLogProviderConnectionsResponse {
    repeated LogProviderConnection connections = 1;
}

message CollectProviderLogsRequest {
    string user_id = 1;
    string workspace_id = 2;
    string project_id = 3;
    string integration_id = 4;
    string log_kind = 5; // runtime | build
    int32 limit = 6;
}

message CollectProviderLogsResponse {
    string source = 1;
    string content = 2;
    string provider = 3;
    string deployment_id = 4;
    int32 line_count = 5;
}
