x-service-hardening: &service-hardening
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m"]

services:
  # ── Infrastructure ────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    container_name: opspilot-postgres
    restart: unless-stopped
    ports:
      # Host port shifted off 5432: other local projects (and a host-native
      # postgres) commonly hold it, and a failed bind leaves this container
      # running with no network, which breaks DNS for every service.
      # Internal traffic is unaffected — services dial postgres:5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opspilot}
      POSTGRES_USER: ${POSTGRES_USER:-opspilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opspilot_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h postgres -U ${POSTGRES_USER:-opspilot} -d ${POSTGRES_DB:-opspilot}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 2s

  redis:
    image: redis:7-alpine
    container_name: opspilot-redis
    restart: unless-stopped
    ports:
      # Shifted off 6379 for the same reason as postgres above.
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "redis", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
      start_interval: 2s

  nats:
    image: nats:2.10-alpine
    container_name: opspilot-nats
    restart: unless-stopped
    # No host publish. NATS has no authentication configured, and JetStream
    # admin over an open port means anyone on the LAN can read every tenant's
    # ingestion events, steal acks, or purge the stream. Both consumers
    # (integration-service, ai-worker) reach it as nats://nats:4222 on the
    # compose network, and the healthcheck uses http://nats:8222 internally.
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://nats:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
      start_interval: 2s

  # ── Go Microservices ──────────────────────────────────────────

  auth-service:
    <<: *service-hardening
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: opspilot-auth
    restart: unless-stopped
    environment:
      AUTH_SERVICE_PORT: "9001"
      AUTH_SERVICE_HEALTH_PORT: "8081"
      DATABASE_URL: ${DATABASE_URL:-postgres://opspilot:opspilot_secret@postgres:5432/opspilot?sslmode=disable}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://auth-service:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
      start_interval: 2s

  workspace-service:
    <<: *service-hardening
    build:
      context: .
      dockerfile: services/workspace-service/Dockerfile
    container_name: opspilot-workspace
    restart: unless-stopped
    environment:
      WORKSPACE_SERVICE_PORT: "9002"
      WORKSPACE_SERVICE_HEALTH_PORT: "8082"
      DATABASE_URL: ${DATABASE_URL:-postgres://opspilot:opspilot_secret@postgres:5432/opspilot?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://workspace-service:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
      start_interval: 2s

  project-service:
    <<: *service-hardening
    build:
      context: .
      dockerfile: services/project-service/Dockerfile
    container_name: opspilot-project
    restart: unless-stopped
    environment:
      PROJECT_SERVICE_PORT: "9003"
      PROJECT_SERVICE_HEALTH_PORT: "8083"
      DATABASE_URL: ${DATABASE_URL:-postgres://opspilot:opspilot_secret@postgres:5432/opspilot?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://project-service:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
      start_interval: 2s

  integration-service:
    <<: *service-hardening
    build:
      context: .
      dockerfile: services/integration-service/Dockerfile
    container_name: opspilot-integration
    restart: unless-stopped
    environment:
      INTEGRATION_SERVICE_PORT: "9004"
      INTEGRATION_SERVICE_HEALTH_PORT: "8084"
      DATABASE_URL: ${DATABASE_URL:-postgres://opspilot:opspilot_secret@postgres:5432/opspilot?sslmode=disable}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      GITHUB_APP_PRIVATE_KEY_BASE64: ${GITHUB_APP_PRIVATE_KEY_BASE64:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      GITHUB_APP_INSTALL_URL: ${GITHUB_APP_INSTALL_URL:-}
      GITHUB_APP_CALLBACK_URL: ${GITHUB_APP_CALLBACK_URL:-}
      GITHUB_WEBHOOK_URL: ${GITHUB_WEBHOOK_URL:-}
      GITHUB_API_VERSION: ${GITHUB_API_VERSION:-2026-03-10}
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://integration-service:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
      start_interval: 2s

  api-gateway:
    <<: *service-hardening
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: opspilot-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8180}:8080"
    environment:
      GATEWAY_PORT: "8080"
      GATEWAY_ENV: ${GATEWAY_ENV:-development}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      AUTH_SERVICE_ADDR: auth-service:9001
      WORKSPACE_SERVICE_ADDR: workspace-service:9002
      PROJECT_SERVICE_ADDR: project-service:9003
      INTEGRATION_SERVICE_ADDR: integration-service:9004
      AI_WORKER_URL: http://ai-worker:8090
      AI_WORKER_INTERNAL_TOKEN: ${AI_WORKER_INTERNAL_TOKEN:?Set AI_WORKER_INTERNAL_TOKEN to a high-entropy value}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
    depends_on:
      auth-service:
        condition: service_healthy
      workspace-service:
        condition: service_healthy
      project-service:
        condition: service_healthy
      integration-service:
        condition: service_healthy
      ai-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://api-gateway:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
      start_interval: 2s

  # ── Isolated fix verification ─────────────────────────────────

  sandbox-runner:
    build:
      context: ./sandbox-runner
      dockerfile: Dockerfile
    container_name: opspilot-sandbox-runner
    restart: unless-stopped
    expose:
      - "8092"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m"]
    environment:
      SANDBOX_RUNNER_INTERNAL_TOKEN: ${SANDBOX_RUNNER_INTERNAL_TOKEN:?Set SANDBOX_RUNNER_INTERNAL_TOKEN to a high-entropy value}
      HOME: /tmp
    volumes:
      # The runner is the only component allowed to reach the Docker daemon.
      # Its API accepts only bounded repository files and emits hardened
      # docker-run invocations; do not expose port 8092 publicly.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://sandbox-runner:8092/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 2s

  # ── AI Worker ──────────────────────────────────────────────────

  ai-worker:
    <<: *service-hardening
    build:
      context: ./ai-worker
      dockerfile: Dockerfile
    container_name: opspilot-ai-worker
    restart: unless-stopped
    expose:
      - "8090"
    environment:
      AI_WORKER_PORT: "8090"
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: ${DATABASE_URL:-postgres://opspilot:opspilot_secret@postgres:5432/opspilot?sslmode=disable}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      GITHUB_APP_PRIVATE_KEY_BASE64: ${GITHUB_APP_PRIVATE_KEY_BASE64:-}
      GITHUB_API_VERSION: ${GITHUB_API_VERSION:-2026-03-10}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      RUN_BACKGROUND_WORKER: "true"
      RETENTION_CLEANUP_SECONDS: ${RETENTION_CLEANUP_SECONDS:-3600}
      AI_WORKER_INTERNAL_TOKEN: ${AI_WORKER_INTERNAL_TOKEN:?Set AI_WORKER_INTERNAL_TOKEN to a high-entropy value}
      SANDBOX_RUNNER_URL: http://sandbox-runner:8092
      SANDBOX_RUNNER_INTERNAL_TOKEN: ${SANDBOX_RUNNER_INTERNAL_TOKEN:?Set SANDBOX_RUNNER_INTERNAL_TOKEN to a high-entropy value}
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      sandbox-runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://ai-worker:8090/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
      start_interval: 2s

  # ── Web application ───────────────────────────────────────────

  frontend:
    <<: *service-hardening
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_local_placeholder}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: opspilot-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3100}:3000"
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_local_placeholder}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL:-/dashboard}
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL:-/dashboard}
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
      - /app/.next/cache:rw,nosuid,nodev,size=64m,uid=1000,gid=1000
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://frontend:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
      start_interval: 2s

volumes:
  postgres_data:
  nats_data:
